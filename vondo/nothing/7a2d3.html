<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallPay - Admin Control Panel</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header / Navbar -->
    <header class="glass-card sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-md max-w-2xl mx-auto">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="window.location.href='../../index.html'">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-md">
                <i class="fa-solid fa-shield-halved text-sm"></i>
            </div>
            <span class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">Admin Panel</span>
        </div>

        <button onclick="window.location.href='../../index.html'" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-xl font-bold transition-all">
            <i class="fa-solid fa-house mr-1"></i> হোম পেজ
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">
        
        <!-- Admin Welcome Banner -->
        <div class="glass-card rounded-2xl p-5 border-indigo-500/30 flex justify-between items-center shadow-lg">
            <div>
                <h2 class="text-base font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-user-shield text-indigo-400"></i>
                    <span>অ্যাডমিন কন্ট্রোল সেন্টার</span>
                </h2>
                <p class="text-xs text-slate-400 mt-1">ইউজার ব্যালেন্স ডিপোজিট, ভেরিফিকেশন এবং স্ট্যাটাস ম্যানেজমেন্ট</p>
            </div>
            <span class="bg-indigo-500/20 text-indigo-300 text-[10px] px-3 py-1 rounded-full border border-indigo-500/30 font-semibold">Super Admin</span>
        </div>

        <!-- Ads Management Card -->
        <div class="glass-card rounded-2xl p-5 space-y-3 border-slate-700">
            <h4 class="text-xs font-bold text-amber-400 flex items-center space-x-1.5">
                <i class="fa-solid fa-bullhorn"></i>
                <span>হোম পেজ বিজ্ঞাপন (Banner) পরিবর্তন</span>
            </h4>
            <div class="space-y-2">
                <input type="text" id="adTitleInput" placeholder="বিজ্ঞাপনের টাইটেল (যেমন: টেলিগ্রাম ভিডিও কল)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                <input type="text" id="adSubtitleInput" placeholder="বিজ্ঞাপনের ডেসক্রিপশন" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                <button onclick="updateDynamicAdBanner()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-xs font-bold transition-all shadow">
                    ব্যানার আপডেট করুন
                </button>
            </div>
        </div>

        <!-- User Search & Manage Card -->
        <div class="glass-card rounded-2xl p-5 space-y-4 border-slate-700">
            <div class="flex justify-between items-center">
                <h4 class="text-xs font-bold text-slate-200 flex items-center space-x-1.5">
                    <i class="fa-solid fa-users-gear"></i>
                    <span>ইউজার ম্যানেজমেন্ট ও ব্যালেন্স ডিপোজিট</span>
                </h4>
                <span id="totalUsersCount" class="text-[10px] text-slate-400">মোট ইউজার: --</span>
            </div>

            <div class="relative">
                <input type="text" id="adminUserSearch" onkeyup="filterAdminUsers()" placeholder="ইউজারনেম বা নাম দিয়ে খোঁজুন..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 pl-9 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
            </div>

            <div class="overflow-x-auto pt-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-[11px] text-slate-400">
                            <th class="py-2.5 px-2">ইউজার তথ্য</th>
                            <th class="py-2.5 px-2">ব্যালেন্স</th>
                            <th class="py-2.5 px-2">ডিপোজিট (Add)</th>
                            <th class="py-2.5 px-2">স্ট্যাটাস</th>
                            <th class="py-2.5 px-2 text-center">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="adminUserTableBody">
                        <!-- Dynamic Rows -->
                        <tr>
                            <td colspan="5" class="text-center py-6 text-xs text-slate-400">ডেটা লোড হচ্ছে...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- JavaScript Files Import (Using Relative Paths) -->
    <script src="../../js/config.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        window.onload = async function() {
            if (typeof window.loadAdminDashboardData === 'function') {
                await window.loadAdminDashboardData();
                if (window.appState && window.appState.allUsersData) {
                    const countEl = document.getElementById('totalUsersCount');
                    if(countEl) countEl.innerText = `মোট ইউজার: ${window.appState.allUsersData.length}`;
                }
            }
        };
    </script>
</body>
</html>
